<!DOCTYPE html>
<html>

<head>
  <title>nowaffle.net - Home</title>
  <style>
    .sidebar {
      width: 350px;
      height: 70vh;
      border: none;
      background: #111;
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.4);
      margin-left: 20px;
      position: fixed;
    }

    html {
      font-family: "Fira Mono", monospace;
      font-weight: 400;
      background-color: #111;
      font-style: bold;
      min-height: 100vh;
      margin: 0;
    }

    .grid {
      position: fixed;
      left: 20%;
    }
  </style>
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css2?family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="main-styles2.css" />
  <link rel="stylesheet" href="tracks.css" />
  <script src="https://unpkg.com/cursor-effects@latest/dist/browser.js"></script>
  <script>
    window.addEventListener("load", (event) => {
      new cursoreffects.fairyDustCursor();
    });
  </script>
  <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>

</head>

<body>
  <script src="oneko.js"></script>
  <header>
    <center><img width="15%" height="auto" src="welcome.gif" /></center>

  </header>
  <marquee scrollamount="20"><img src="construction.gif" /></marquee>
  <div class="content-layout">
    <iframe class="sidebar" src="sidebar.html"></iframe>
    <div class="grid" data-masonry='{ "itemSelector": ".grid-item", "columnWidth": 200, "gutter": 10 }'>
      <div class="grid-item grid-item--width2">
        <h2>Books</h2>
        <div>
          <style type="text/css" media="screen">
            .gr_grid_container {
              /* customize grid container div here. eg: width: 500px; */
            }

            .gr_grid_book_container {
              /* customize book cover container div here */
              float: left;
              width: 39px;
              height: 60px;
              padding: 0px 0px;
              overflow: hidden;
            }
          </style>
          <div id="gr_grid_widget_1793661493">
            <div class="gr_grid_container">
              <p>loading :3</p>
            </div>
          </div>
          <script
            src="https://www.goodreads.com/review/grid_widget/170065400.Favorite%20books?cover_size=small&hide_link=&hide_title=&num_books=20&order=a&shelf=favorites&sort=date_added&widget_id=1793661493"
            type="text/javascript" charset="utf-8"></script>

        </div>
        <div>
          <div id="gr_grid_widget_1793661602">
            <p>loading :3</p>
          </div>

        </div>
        <script
          src="https://www.goodreads.com/review/grid_widget/170065400.read%20books?cover_size=small&hide_link=&hide_title=&num_books=100&order=a&shelf=read&sort=date_added&widget_id=1793661602"
          type="text/javascript" charset="utf-8"></script>

      </div>
    </div>
  </div>
  </div>
  <img src="flames.gif" style="
        width: 50%;
        height: auto;
        display: block;
        margin-left: auto;
        margin-right: auto;
      " />
  <script src="title-rotator.js"></script>
  <script src="global.js"></script>
</body>

</html>
